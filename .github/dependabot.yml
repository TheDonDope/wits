# Version updates. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Go modules. The tree is mostly the Charm v2 line and its transitive
  # dependencies, which move together; grouping them keeps a week's worth of
  # bumps to one reviewable pull request rather than a dozen.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
      go-x:
        patterns:
          - "golang.org/x/*"
      gomod-minor:
        update-types:
          - minor
          - patch

  # Electron, the AppImage's window: pinned, and a major version a pull
  # request of its own.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # The pinned action SHAs in the Go workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
