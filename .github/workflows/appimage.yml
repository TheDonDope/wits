name: AppImage

# The AppImage, built and checked for a pull request that changes how it is
# made — the release builds it only once the release is published, too late
# to find it broken. Nothing is attached anywhere.
on:
  pull_request:
    paths:
      - appimage.sh
      - packaging/**
      - desktop/**
      - .github/workflows/appimage.yml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git describe, for the version stamped in, needs the tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            wits-ui/package-lock.json
            desktop/package-lock.json

      - name: Install what the window needs
        run: sudo apt-get update && sudo apt-get install -y libnss3 libasound2t64 xvfb

      - name: Build the AppImage
        run: ./appimage.sh

      - name: Check the AppImage
        run: ./appimage.sh check
