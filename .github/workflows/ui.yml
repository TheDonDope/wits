name: wits-ui

# The browser client, checked with its dependencies installed: lint with types,
# the tests, and a production build. Codacy's ESLint runs without them and
# cannot resolve a single Angular type, so this is where the client's lint
# actually happens.
on:
  push:
    branches: ['main']
    paths: ['wits-ui/**', '.github/workflows/ui.yml']
  pull_request:
    branches: ['main']
    paths: ['wits-ui/**', '.github/workflows/ui.yml']

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wits-ui
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: wits-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint, with types
        run: npx ng lint

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build
