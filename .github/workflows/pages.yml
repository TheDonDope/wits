name: Pages

# wits for the phone, on GitHub Pages: the client built with the engine in
# it (make pages), served at https://thedondope.github.io/wits/. It holds no
# data — the journal lives on each phone, and only encrypted bundles travel,
# by hand. Deployed from main, after the checks.
on:
  push:
    branches: ['main']
    paths:
      - 'wits-ui/**'
      - 'cmd/wits-wasm/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and the newest wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # The tags, so the build can name itself after the last one.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: wits-ui/package-lock.json

      - name: Install
        run: npm ci
        working-directory: wits-ui

      - name: Build
        run: make pages

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: wits-ui/dist/wits-ui/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
