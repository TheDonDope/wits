name: Go

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # The toolchain the module declares, so the two cannot drift apart.
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Build
        run: make build

      - name: Build for Windows
        # The journal has a Windows lock implementation; cross-compiling is
        # the cheapest way to keep it compiling.
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: Vet
        run: make vet

      - name: Test
        run: make test-ci

      # The coverage uploads need repository secrets, which GitHub withholds
      # from Dependabot and fork pull requests. Skipping them there keeps the
      # build honest — a genuine code failure still fails — while a secret-less
      # run does not show a false red for a token it was never given.
      - name: Upload coverage reports to Codecov
        if: ${{ github.actor != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run codacy-coverage-reporter
        if: ${{ github.actor != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork }}
        uses: codacy/codacy-coverage-reporter-action@6904bd01e29ada115135b5eca20125758ccae53b
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: 'coverage.out'
          force-coverage-parser: 'go'
